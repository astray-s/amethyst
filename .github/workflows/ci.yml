name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-android:
    name: Web and Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frozen JavaScript dependencies
        run: npm ci

      - name: Lint web source
        run: npm run lint

      - name: Run web unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Run Android unit tests, lint, and debug build
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install frozen JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser test output on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-output-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
